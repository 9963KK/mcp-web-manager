version: "3.8"
services:
  mcp-web-manager:
    image: 9963kk/mcp-web-manager:latest
    pull_policy: always
    # 如需在 ARM 机器上强制拉取 amd64 镜像，可取消下一行注释
    # platform: linux/amd64
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=sqlite:////data/mcp_web_manager.db
      # 复制链接展示使用的外网主机名；如不设置将自动回退 127.0.0.1
      # - PUBLIC_HOST=your.domain.com
    volumes:
      - mcpwm-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mcpwm-data:
    driver: local

